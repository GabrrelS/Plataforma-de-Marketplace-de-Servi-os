services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - marketplace-net

  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    ports:
      - "6379:6379"
    networks:
      - marketplace-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: marketplace-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - marketplace-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: marketplace-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - marketplace-net
    restart: unless-stopped

  backend:
    build:
      context: ./src/PlataformaServicos
      dockerfile: Dockerfile
    container_name: marketplace_backend
    ports:
      - "5006:5006"
    environment:
      ASPNETCORE_URLS: http://+:5006
    networks:
      - marketplace-net

  frontend:
    build:
      context: ./src/PlataformaServicos.Angular
      dockerfile: Dockerfile
    container_name: marketplace_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - marketplace-net

networks:
  marketplace-net:

volumes:
  grafana-data: